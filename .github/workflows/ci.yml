name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned until ADR-0009 matches the RHEL server's Node LTS.
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit and HTTP-level tests use an in-memory fake; the MySQL integration
      # suite runs in the db-integration job below (no containers by policy).

      - name: Infra shell scripts syntax
        run: for f in infra/*/*.sh; do bash -n "$f"; done

      - name: Format
        run: npm run format:check

      - name: Lint and typecheck
        run: npx turbo run lint typecheck

      - name: End-to-end suite typecheck
        run: npx tsc -p e2e/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx turbo run build

      # The committed OpenAPI document must match what the code generates, so
      # API contracts and clients can never drift silently.
      - name: OpenAPI and client drift check
        run: |
          npm run openapi -w @pegah/api
          npx prettier --write apps/api/openapi.json
          npm run generate -w @pegah/api-client
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts

  db-integration:
    # Real MySQL 8.4 LTS from Oracle's tarball, started as a plain process:
    # no containers (policy), same major version as production.
    name: Database integration (MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MYSQL_VERSION: 8.4.13
      MYSQL_SHA256: 5dfbb764f731df40ef9e4f5d69aed32bdac8ba1af20bd96b7d40a942d83d4ed2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-mysql

      - name: Start Redis (Ubuntu package, plain process)
        run: |
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl start redis-server
          redis-cli ping
          echo "PEGAH_IT_REDIS_URL=redis://127.0.0.1:6379/0" >> "$GITHUB_ENV"

      - name: Build database package
        run: npm run build -w @pegah/db

      - name: Integration tests
        run: npx vitest run apps/api/src/test/ apps/api/src/rbac/redis-throttler.storage.test.ts --exclude "**/app.e2e.test.ts"

      - name: MySQL error log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/mysqld.err" || true

  db-integration-mariadb:
    # The same integration suite on MariaDB 11.4 LTS (tarball, plain process,
    # no containers): the database cPanel shared hosts provide (ADR-0040).
    name: Database integration (MariaDB 11.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MARIADB_VERSION: 11.4.5
      MARIADB_SHA256: 2a44cb70a87dba7eb2cab3b5af2c0416a0204d93a8fda387b4b70c9f1bab7bd6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-mariadb

      - name: Build database package
        run: npm run build -w @pegah/db

      - name: Integration tests
        run: npx vitest run apps/api/src/test/ --exclude "**/app.e2e.test.ts"

      - name: MariaDB error log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/mariadbd.err" || true

  e2e:
    # The whole stack (API, website, console) against real MySQL 8.4, driven by
    # Playwright in Chromium, with an axe WCAG 2.1 AA scan on every key page.
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MYSQL_VERSION: 8.4.13
      MYSQL_SHA256: 5dfbb764f731df40ef9e4f5d69aed32bdac8ba1af20bd96b7d40a942d83d4ed2
      # Server-side rendering and the /api, /admin rewrites reach the local stack.
      API_INTERNAL_URL: http://127.0.0.1:4000
      ADMIN_INTERNAL_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-mysql

      - name: Build
        run: npx turbo run build --force

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: npm run e2e:prepare

      - name: End-to-end tests
        run: npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
