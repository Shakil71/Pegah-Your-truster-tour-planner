name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned until ADR-0009 matches the RHEL server's Node LTS.
          node-version: 22
          cache: npm

      - run: npm ci

      # No database in CI (no containers by policy): unit and HTTP-level tests
      # use an in-memory fake; prisma generate needs no connection.

      - name: Infra shell scripts syntax
        run: for f in infra/*/*.sh; do bash -n "$f"; done

      - name: Format
        run: npm run format:check

      - name: Lint and typecheck
        run: npx turbo run lint typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx turbo run build

      # The committed OpenAPI document must match what the code generates, so
      # API contracts and clients can never drift silently.
      - name: OpenAPI drift check
        run: |
          npm run openapi -w @pegah/api
          npx prettier --write apps/api/openapi.json
          git diff --exit-code -- apps/api/openapi.json
