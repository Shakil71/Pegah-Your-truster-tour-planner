name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned until ADR-0009 matches the RHEL server's Node LTS.
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit and HTTP-level tests use an in-memory fake; the MySQL integration
      # suite runs in the db-integration job below (no containers by policy).

      - name: Infra shell scripts syntax
        run: for f in infra/*/*.sh; do bash -n "$f"; done

      - name: Format
        run: npm run format:check

      - name: Lint and typecheck
        run: npx turbo run lint typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx turbo run build

      # The committed OpenAPI document must match what the code generates, so
      # API contracts and clients can never drift silently.
      - name: OpenAPI and client drift check
        run: |
          npm run openapi -w @pegah/api
          npx prettier --write apps/api/openapi.json
          npm run generate -w @pegah/api-client
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts

  db-integration:
    # Real MySQL 8.4 LTS from Oracle's tarball, started as a plain process:
    # no containers (policy), same major version as production.
    name: Database integration (MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MYSQL_VERSION: 8.4.13
      MYSQL_SHA256: 5dfbb764f731df40ef9e4f5d69aed32bdac8ba1af20bd96b7d40a942d83d4ed2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/mysql-dl
          key: mysql-${{ env.MYSQL_VERSION }}-linux-glibc2.28-minimal

      - name: Start MySQL ${{ env.MYSQL_VERSION }}
        run: |
          sudo apt-get install -y --no-install-recommends libaio1t64 libnuma1
          # MySQL links libaio.so.1; Ubuntu 24.04 ships it as libaio.so.1t64.
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          f=~/mysql-dl/mysql.tar.xz
          if [ ! -f "$f" ]; then
            mkdir -p ~/mysql-dl
            curl -fsSL -o "$f" "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-${MYSQL_VERSION}-linux-glibc2.28-x86_64-minimal.tar.xz" ||
              curl -fsSL -o "$f" "https://cdn.mysql.com/archives/mysql-8.4/mysql-${MYSQL_VERSION}-linux-glibc2.28-x86_64-minimal.tar.xz"
          fi
          echo "${MYSQL_SHA256}  $f" | sha256sum -c -
          mkdir -p ~/mysql && tar -xJf "$f" -C ~/mysql --strip-components=1
          data="$RUNNER_TEMP/mysql-data"
          ~/mysql/bin/mysqld --no-defaults --initialize-insecure --datadir="$data" --user="$(whoami)"
          ~/mysql/bin/mysqld --no-defaults --datadir="$data" --user="$(whoami)" \
            --port=3307 --bind-address=127.0.0.1 --mysqlx=OFF \
            --socket="$RUNNER_TEMP/mysql.sock" --log-error="$RUNNER_TEMP/mysqld.err" &
          for _ in $(seq 1 60); do
            ~/mysql/bin/mysqladmin --no-defaults -uroot -h127.0.0.1 -P3307 ping >/dev/null 2>&1 && break
            sleep 1
          done
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          ~/mysql/bin/mysql --no-defaults -uroot -h127.0.0.1 -P3307 -e \
            "CREATE USER 'pegah_it'@'127.0.0.1' IDENTIFIED BY '$pw';
             GRANT ALL PRIVILEGES ON \`pegah\_it\_%\`.* TO 'pegah_it'@'127.0.0.1';"
          echo "PEGAH_IT_DATABASE_URL=mysql://pegah_it:$pw@127.0.0.1:3307/?allowPublicKeyRetrieval=true" >> "$GITHUB_ENV"

      - name: Build database package
        run: npm run build -w @pegah/db

      - name: Integration tests
        run: npx vitest run apps/api/src/test/ --exclude "**/app.e2e.test.ts"

      - name: MySQL error log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/mysqld.err" || true
