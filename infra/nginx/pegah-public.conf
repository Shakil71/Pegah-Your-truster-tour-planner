# Pegah — public domain (pegah.com.bd) on 80/443 with a Let's Encrypt
# certificate. Installed as /etc/nginx/conf.d/pegah-public.conf; the
# IP-based pre-launch config (pegah.conf, :8180/:8443) stays alongside it.
#
# Certificate: certbot webroot (/var/www/pegah-acme), renewed by
# certbot-renew.timer; infra/letsencrypt/pegah-nginx-deploy-hook.sh reloads
# nginx after a renewal. See docs/operations/DEPLOYMENT.md, "Public domain HTTPS".
# The API must list https://pegah.com.bd in APP_ORIGINS, or sign-ins fail
# with "Origin not allowed".

server {
    listen 80;
    listen [::]:80;
    server_name pegah.com.bd www.pegah.com.bd;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pegah-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://pegah.com.bd$request_uri;
    }
}

# www → the one canonical origin, so sign-in cookies and APP_ORIGINS only
# ever see https://pegah.com.bd. The certificate covers both names.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pegah.com.bd;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pegah.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pegah.com.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pegah_public_ssl:5m;
    ssl_session_timeout 1h;

    return 308 https://pegah.com.bd$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pegah.com.bd;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pegah.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pegah.com.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pegah_public_ssl:5m;
    ssl_session_timeout 1h;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (never append) so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # Certificate is publicly trusted, so browsers may remember HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Visa and travel documents (ADR-0039): up to 5 MB, on the upload routes only.
    location ~ ^/api/v1/(me|admin)/requests/[0-9A-HJKMNP-TV-Z]{26}/documents$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4100;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
