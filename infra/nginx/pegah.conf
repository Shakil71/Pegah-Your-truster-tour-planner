# Pegah — public site, admin (/admin, proxied by the web app) and API (/api).
#
# HTTPS on :8443 with a self-signed certificate until a domain exists
# (ADR-0019). Session cookies are Secure (__Host- prefix), so sign-in only
# works over HTTPS; plain :8180 redirects there. When a domain is chosen,
# replace the certificate with a real one (e.g. Let's Encrypt) and move to 443.

# Plain HTTP: redirect everything to HTTPS on the same host.
server {
    listen 8180;
    listen [::]:8180;
    server_name _;
    server_tokens off;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/pki/tls/pegah/pegah-selfsigned.crt;
    ssl_certificate_key /etc/pki/tls/pegah/pegah-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pegah_ssl:5m;
    ssl_session_timeout 1h;
    # No HSTS while the certificate is self-signed: it would pin browsers to it.

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (never append) so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
