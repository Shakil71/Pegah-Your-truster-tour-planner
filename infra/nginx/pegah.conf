# Pegah — public site and API on :8180 until a domain and TLS exist.
# The admin app is reached at /admin: apps/web proxies /admin/* to 127.0.0.1:3101
# (Next.js rewrite). It shows sample data only until staff login is connected.
server {
    listen 8180;
    listen [::]:8180;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
